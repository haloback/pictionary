name: Colophon (taste models)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/convert_clip.py
      - scripts/train_genre_head.py
      - .github/workflows/colophon-models.yml

jobs:
  convert:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converters
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.4.1" "transformers==4.45.2" "coremltools==8.1" "numpy<2" pillow
      - name: Convert CLIP ViT-B/32 to Core ML
        run: python scripts/convert_clip.py --out build/models
      - name: Train the genre head on real covers (Open Library)
        continue-on-error: true
        run: |
          python -m pip install scikit-learn
          python scripts/train_genre_head.py --out build/models --per-genre 240
      - uses: actions/upload-artifact@v4
        with:
          name: Colophon-Taste-Models
          path: |
            build/models/*.zip
            build/models/*.json
      - name: Publish to the models-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/models
          files="clip-vit-b32-image.mlpackage.zip clip-vit-b32-text.mlpackage.zip clip-tokenizer.zip tokenizer-reference.json manifest.json"
          [ -f aesthetic-vit-b32.json ] && files="$files aesthetic-vit-b32.json"
          [ -f genre-head-vit-b32.json ] && files="$files genre-head-vit-b32.json"
          if gh release view models-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload models-v1 $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create models-v1 $files --repo "$GITHUB_REPOSITORY" --title "Taste models v1" \
              --notes "CLIP ViT-B/32 (OpenAI, MIT) converted to Core ML for Colophon, plus its tokenizer and the LAION aesthetic head (MIT). Downloaded by the app on first use."
          fi
