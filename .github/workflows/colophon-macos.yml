name: Colophon (macOS app)

on:
  push:
    paths:
      - "Colophon/**"
      - ".github/workflows/colophon-macos.yml"
  pull_request:
    paths:
      - "Colophon/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Colophon
    env:
      # Optional. Add these repository secrets to ship a signed, notarized app:
      # MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
      # MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password).
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Fetch public-domain test photos
        continue-on-error: true
        run: |
          mkdir -p build/photos
          ua="ColophonCI/1.0 (sample renders)"
          curl -fsSL -A "$ua" -m 60 -o build/photos/a-aldrin.jpg "https://images-assets.nasa.gov/image/as11-40-5903/as11-40-5903~medium.jpg" || true
          curl -fsSL -A "$ua" -m 60 -o build/photos/b-monalisa.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg?width=1000" || true
          curl -fsSL -A "$ua" -m 60 -o build/photos/c-earth.jpg "https://images-assets.nasa.gov/image/as17-148-22727/as17-148-22727~medium.jpg" || true
          ls -la build/photos
      - name: Render style samples
        env:
          COLOPHON_SAMPLES: ${{ github.workspace }}/Colophon/build/samples
          COLOPHON_PHOTOS: ${{ github.workspace }}/Colophon/build/photos
        run: swift test --filter SampleRenderTests
      - uses: actions/upload-artifact@v4
        with:
          name: Colophon-Style-Samples
          path: Colophon/build/samples
      - name: Publish samples to the colophon-style-samples branch
        if: github.event_name == 'push'
        working-directory: Colophon/build/samples
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b colophon-style-samples
          git add .
          git -c user.name="colophon-ci" -c user.email="colophon-ci@users.noreply.github.com" commit -qm "Style samples for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" colophon-style-samples
      - name: Package Colophon.app
        run: |
          chmod +x scripts/make-app.sh
          scripts/make-app.sh release
      - name: Sign with Developer ID and notarize
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" build/Colophon.app
          ditto -c -k --keepParent build/Colophon.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Colophon.app
          rm build/notarize.zip
      - name: Zip
        run: cd build && ditto -c -k --keepParent Colophon.app Colophon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Colophon-macOS
          path: Colophon/build/Colophon.zip
